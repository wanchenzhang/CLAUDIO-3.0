# Kojak version 1.5.3 parameter file
# Please see online documentation at: 
# http://www.kojak-ms.org/param

#
# Computational resources
#
threads     =   8  #Increase to use more cores/nodes

#
# Data input files: include full path if not in current working directory
#
database            =   X:\Tau_Isoform-F(Human)-HisTag.fasta
export_percolator	=	1
export_pepXML		=	1
#MS_data_file        =   [X:\...data.raw]
percolator_version  =   3.0


#
# Parameters used to described the data being input to Kojak
#
enrichment      =   0       #Values between 0 and 1 to describe 18O APE. 
                            #For example, 0.25 equals 25 APE.
instrument      =   0       #Values are: 0=Orbitrap, 1=FTICR (such as Thermo LTQ-FT)
MS1_centroid    =   0       #0=no, 1=yes
MS2_centroid    =   1       #0=no, 1=yes
MS1_resolution  =   60000   #Resolution at 400 m/z, value ignored if data are 
                            #already centroided
MS2_resolution  =   15000   #Resolution at 400 m/z, value ignored if data are 
                            #already centroided

#
# Cross-link and mono-link masses allowed. May have more than one of each parameter.
#
#cross_link		=	nK	nK	509.097364		CBDPS_Light			#H8
#mono_link		=	nK	526.1238898			CBDPS_Light_DE_n	#H8
#mono_link		=	nK	527.107929			CBDPS_Light_DE_O	#H8
#cross_link		=	nK	nK	517.147578		CBDPS_Heavy			#D8
#mono_link		=	nK	534.1741038			CBDPS_Heavy_DE_n	#D8
#mono_link		=	nK	535.158143			CBDPS_Light_DE_O	#D8

#cross_link	=	nK	nK	110.0362342	DSA_Light	#12C6
#mono_link	=	nK	128.0706042
#mono_link	=	nK	129.0546242
#cross_link	=	nK	nK	116.0563632	DSA_Heavy	#13C6
#mono_link	=	nK	134.0907332
#mono_link	=	nK	135.0747532

#cross_link	=	nK	nK	96.02112937	DSG_Light	#H6D6
#mono_link	=	nK	114.0316941						#Type I-OH
#mono_link	=	nK	113.0476785						#Type I-NH2
#cross_link	=	nK	nK	102.0587898	DSG_Heavy	#H6D6
#mono_link	=	nK	120.0693545						#Type I-OH
#mono_link	=	nK	119.0853389						#Type I-NH2

#cross_link	=	nK	ACDEFGHIKLMNPQRSTVWY	82.041865	SDA	#SDA
#mono_link	=	nK	84.0575149			#SDA


#
# Differential modifications
#
modification            =       M       15.9949
diff_mods_on_xl			=		1		#0=off 1=on
max_mods_per_peptide    =       2
mono_links_on_xl		=		1


#
# Digestion enzyme rules
#
enzyme  =       [KR]|{P}	#Trypsin


#
# Scoring algorithm parameters
#
fragment_bin_offset     =   0.0     #between 0.0 and 1.0
fragment_bin_size       =   0.03  #in Thomsons
ion_series_A			=	0
ion_series_B			=	1
ion_series_C			=	0
ion_series_X			=	0
ion_series_Y			=	1
ion_series_Z			=	0		#Z-dot values are used


#
# Additional parameters used in Kojak analysis
#
decoy_filter            =   decoy   #identifier for all decoys in the database. 
                                    #Default value is "random" (without quotes)
isotope_error           =   1       #account for errors in precursor peak identification.
                                    #Searches this number of isotope peak offsets. 
									#Values are 0,1,or 2.
max_miscleavages        =   3       #number of missed trypsin cleavages allowed
max_peptide_mass        =   8000.0  #largest allowed peptide mass in Daltons
min_peptide_mass        =   300.0   #lowest allowed peptide mass in Daltons
max_spectrum_peaks      =   0       #top N peaks to use during analysis. 0 uses all peaks.
ppm_tolerance_pre       =   10.0    #mass tolerance on precursor when searching
prefer_precursor_pred   =   2       #prefer precursor mono mass predicted by 
                                    #instrument software. 
                                    #  0 = ignore previous predictions
                                    #  1 = use only previous predictions
                                    #  2 = supplement predictions with additional analysis
spectrum_processing     =   0       #0=no, 1=yes
top_count               =   300     #number of top scoring single peptides to combine 
                                    #in relaxed analysis
truncate_prot_names     =	0       #Max protein name character to export, 0=off
turbo_button			=	1       #Generally speeds up analysis. Special cases cause reverse
                                    #effect, thus this is allowed to be disabled. 0=off